[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "chromadb-client==0.5.20",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not live_model and not e2e'"
markers = [
    "live_model: hits a real Ollama endpoint; excluded by default, opt in with -m live_model",
    "e2e: hits a running backend container over HTTP (BACKEND_URL); excluded by default, run via `docker compose --profile test run --rm backend-tests`",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
# SQLAlchemy's async dialects run query execution inside a spawned
# greenlet (greenlet_spawn) — without this, coverage's default tracer
# doesn't follow into it, and every line after an `await db.scalar(...)`
# et al. reads as "missed" even when the test suite runs it.
concurrency = ["greenlet", "thread"]
source = ["src"]
