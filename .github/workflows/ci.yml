name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.30"

jobs:
  backend-lint:
    name: Backend / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run ruff format --check .
      - working-directory: backend
        run: uv run ruff check .

  backend-type-check:
    name: Backend / type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run pyright

  backend-test:
    name: Backend / test (coverage >= 80% on domain/ + agents/)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learn_buddy
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: learn_buddy
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U learn_buddy -d learn_buddy"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
      chromadb:
        image: chromadb/chroma:0.5.20
        ports: ["8001:8000"]
    env:
      DATABASE_URL: postgresql+asyncpg://learn_buddy:change-me@localhost:5432/learn_buddy
      REDIS_URL: redis://localhost:6379/0
      CHROMA_HOST: localhost
      CHROMA_PORT: 8001
      JWT_SECRET: ci-test-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - working-directory: backend
        run: uv sync --frozen
      - name: Wait for chromadb
        run: timeout 60 bash -c 'until curl -sf http://localhost:8001/api/v1/heartbeat; do sleep 2; done'
      - name: "Test (default suite: no live_model, no e2e)"
        working-directory: backend
        run: |
          uv run pytest --cov=src/domain --cov=src/agents \
            --cov-report=term-missing --cov-fail-under=80

  frontend-lint-type-check:
    name: Frontend / lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run type-check
      - working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-build:
    name: Docker build (backend runtime + test stages, frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t learn-buddy-backend:ci --target runtime ./backend
      - run: docker build -t learn-buddy-backend-test:ci --target test ./backend
      - run: docker build -t learn-buddy-frontend:ci --target runtime ./frontend
      - name: Guard against the default build target silently changing
        # See decisions/0009-pin-docker-build-target.md: a Dockerfile
        # stage appended after `runtime` silently becomes the default for
        # any build that doesn't pin a target — docker-compose.yml pins
        # one explicitly, but this catches the underlying Dockerfiles'
        # own stage order drifting too.
        run: |
          [ "$(docker inspect --format '{{json .Config.Cmd}}' learn-buddy-backend:ci)" = '["uvicorn","src.main:app","--host","0.0.0.0","--port","8000"]' ]
          [ "$(docker inspect --format '{{json .Config.Cmd}}' learn-buddy-frontend:ci)" = '["node","server.js"]' ]

  compose-integration:
    name: Full docker-compose integration (all five services)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint-type-check, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Write a minimal .env for docker compose
        run: |
          cp .env.example .env
          echo "JWT_SECRET=ci-integration-secret-do-not-use-in-production" >> .env

      - name: Bring up all five services
        run: docker compose up -d --build

      - name: Wait for backend to report healthy
        run: |
          timeout 180 bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" learn_buddy-backend-1 2>/dev/null)" = "healthy" ]; do
              sleep 3
            done
          '

      - name: Wait for the rest of the stack
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8000/health >/dev/null; do sleep 3; done'
          timeout 180 bash -c 'until curl -sf http://localhost:3000/ >/dev/null; do sleep 3; done'
          docker compose ps

      - name: Apply migrations
        # A fresh stack's postgres volume has no schema yet — nothing in
        # `docker compose up` runs this automatically (see
        # wiki/runbook.md's "migrate" step); every e2e request would 500
        # with "relation ... does not exist" without it. Caught by
        # actually running this job's steps by hand before trusting them.
        run: docker compose exec -T backend alembic upgrade head

      - name: Run the e2e suite against the real running containers
        run: docker compose --profile test run --rm backend-tests

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
